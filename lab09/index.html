<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reads the XML data using JavaScript</title>

    <!-- CSS -->
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #7ce2af
        }

        th {
            background-color: #7c0f65;
            color: white;
        }

        .button {
            position: relative;
            text-align: center;
            padding: 20px;
            border: 4px solid rgb(55, 12, 211);
            background: rgba(20, 192, 4, 0.5);
            color: rgb(230, 36, 78);
            outline: none;
            border-radius: 30px;
            font-size: 30px;
            width: 500px;
            text-align: center;

        }

        .button:hover {
            color: black;
            background: white;

        
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }   
    </style>

    <!--JavaScript-->
    <script>
        let dataLoaded = false;

        function toggleTable() {
            let table = document.getElementById("empTable");
            let button = document.getElementById("toggleBtn");

            if (!dataLoaded) {
                // First click: fetch the XML and fill the table
                loadXMLDoc();
                dataLoaded = true;
            }

            if (table.style.display === "none") {
                table.style.display = "";
                button.textContent = "Hide employees";
            } else {
                table.style.display = "none";
                button.textContent = "Show employees";
            }
        }

        function loadXMLDoc() {
            let xmlhttp = new XMLHttpRequest();
            xmlhttp.overrideMimeType("text/xml");
            xmlhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    empDetails(this);
                }
            };
            xmlhttp.open("GET", "employee.xml", true);
            xmlhttp.send();
        }

        // Returns the text of the first matching child tag, or "" if missing or empty
        function getValue(parent, tag) {
            let el = parent.getElementsByTagName(tag)[0];
            return (el && el.firstChild) ? el.firstChild.nodeValue : "";
        }

        function empDetails(xml) {
    let xmlDoc = xml.responseXML;
    let table =
        "<tr><th>Firstname</th><th>Lastname</th>" +
        "<th>Title</th><th>Division</th>" +
        "<th>Building</th><th>Room</th></tr>";

    let employees = xmlDoc.getElementsByTagName("employee");
    for (let i = 0; i < employees.length; i++) {
        let e = employees[i];
        table += "<tr>" +
            "<td>" + getValue(e, "firstname") + "</td>" +
            "<td>" + getValue(e, "lastname") + "</td>" +
            "<td>" + getValue(e, "title") + "</td>" +
            "<td>" + getValue(e, "division") + "</td>" +
            "<td>" + getValue(e, "building") + "</td>" +
            "<td>" + getValue(e, "room") + "</td>" +
            "</tr>";
        }

    document.getElementById("empTable").innerHTML = table;
}
    </script>
</head>

<body>
    
    <button id="toggleBtn" class="button" onclick="toggleTable()">Show employees</button>
<table id="empTable" style="display: none;"></table>
    

    <br><br>
    <table id="id"></table>
</body>

</html>
